[project]
name = "is2-inventarios"
version = "0.1.0"
description = "Django inventory management system (Software Engineering II course project)"
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2,<4.3",
    "djangorestframework>=3.15,<3.16",
    "django-ratelimit>=3.0,<4",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9,<3"]

[tool.uv]
package = false
